[project]
name = "shared"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "evaluation",
    "interface",
    "xgboost>=2.1.4",
    "scikit-learn>=1.6.1",
    "toolz>=1.0.0",
    "polars>=1.24.0",
    "pyarrow>=19.0.1",
    "pandas>=2.2.3",
    "lightgbm>=4.6.0",
    "torch>=2.6.0",
    "matplotlib>=3.10.1",
    "numpy>=2.2.3",
    "ipykernel>=6.29.5",
]

# evaluation and interface are workspace packages, not PyPI packages.
[tool.uv.sources]
evaluation = { workspace = true }
interface = { workspace = true }

[tool.hatch.build.targets.wheel]
include = ["wiz/shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
