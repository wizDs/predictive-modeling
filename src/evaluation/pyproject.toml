[project]
name = "evaluation"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "scikit-learn>=1.6.1",
    "numpy>=2.2.3",
    "polars>=1.24.0",
    "pydantic>=2.10.6",
]

[tool.hatch.build.targets.wheel]
packages = ["wiz/evaluation"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
