[tool.uv.workspace]
members = [
    "src/budget",
    "src/evaluation",
    "src/interface",
    "src/shared",
    "src/job_app_backend",
]

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
mypy_path = "src/budget:src/evaluation:src/interface:src/job_app_backend:src/shared"
ignore_missing_imports = true
show_error_codes = true

[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Target Python is 3.13+ and pydantic is used heavily; PEP 563 deferred evaluation isn't needed and can break pydantic forward-ref resolution."

# Dev tooling shared across the whole workspace.
# Install with: uv sync --all-packages --group dev
[dependency-groups]
dev = [
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "types-python-dateutil>=2.9",
    "types-requests>=2.32",
    "pytest>=8.3",
    "ruff>=0.9",
]
