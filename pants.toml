[GLOBAL]
pants_version = "2.32.1"
backend_packages = [
    "pants.backend.python",
    "pants.backend.python.typecheck.mypy",
]

[source]
# Every package -- src/<pkg> and apps/<app>, including the apps nested under apps/tools-app --
# has its own pyproject.toml, so using it as a source-root marker makes each one a source root
# automatically. An earlier version of this hardcoded root_patterns = ["/apps/*",
# "/apps/tools-app/*"] instead: correct for today's layout, but a future app nested somewhere
# that pattern doesn't anticipate would silently never become a source root -- no error, it
# would just never show up in `pants --tag=app list` and its mypy-apps CI leg would silently
# never run (github.com/wizDs/predictive-modeling/issues/16, issues/25). Marker-file detection
# has no such depth limit. The repo-root and notebooks/ pyproject.toml also become source roots
# as a harmless side effect -- nothing declares a python_sources() target there, so nothing
# claims files under them. Pants uses all of this purely for dependency-graph purposes (see
# apps/BUILD and .github/workflows/ci.yml's `changes` job), not to run mypy or resolve apps'
# third-party deps through Pants; each app keeps its own independent uv-managed environment.
marker_filenames = ["pyproject.toml"]

[python]
interpreter_constraints = ["==3.13.*"]
enable_resolves = true
resolves = { python-default = "3rdparty/python/default.lock", mypy-tool = "3rdparty/python/mypy-tool.lock" }
# Use the real `uv` binary (rather than pip/pex) to generate Pants' lockfiles, since this
# repo's dependency workflow is uv-based. Pants still owns and commits its own lockfiles
# separately from the root uv.lock -- Pants can't read uv.lock directly (see
# 3rdparty/python/requirements.txt for why).
resolver = "uv"

[mypy]
install_from_resolve = "mypy-tool"
config = "pyproject.toml"
