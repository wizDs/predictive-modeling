[project]
name = "churn"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.3",
    "polars>=1.22.0",
    "xgboost>=2.1.4",
    "ipykernel>=6.29.5",
    "scikit-learn>=1.6.1",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
exclude = "(^|/)(\\.venv|\\.mypy_cache|\\.pytest_cache|__pycache__|data)(/|$)"
