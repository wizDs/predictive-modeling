[project]
name = "finance"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "yfinance>=0.2.50",
    "polars>=1.14.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
exclude = "(^|/)(\\.venv|\\.mypy_cache|\\.pytest_cache|__pycache__)(/|$)"
