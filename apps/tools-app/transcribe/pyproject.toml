[project]
name = "transcribe"
version = "0.1.0"
description = "Audio recording and transcription with Whisper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai-whisper>=20250625",
    "streamlit>=1.40.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
]

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
exclude = "(^|/)(\\.venv|\\.mypy_cache|\\.pytest_cache|__pycache__)(/|$)"
