[project]
name = "tools-app"
version = "0.1.0"
description = "Unified multi-tool Streamlit app"
requires-python = ">=3.13"
dependencies = [
    "holidays>=0.93",
    "joblib>=1.5.3",
    "openai-whisper>=20250625",
    "pandas>=2.3.3",
    "polars>=1.36.1",
    "pydantic>=2.12.5",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "seaborn>=0.13.2",
    "streamlit>=1.52.1",
    "watchdog>=6.0.0",
    "job-app-backend",
    "minio>=7.2.20",
]

[dependency-groups]
dev = [
    "budget",
    "power-app",
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
    "types-python-dateutil>=2.9",
    "ruff>=0.9",
    "pytest>=9.1.1",
]

[tool.uv.sources]
budget = { path = "../../src/budget", editable = true }
power-app = { path = "../power-app", editable = true }
job-app-backend = { path = "../../src/job_app_backend", editable = true }

# Installs this project itself (editable) so job_app is importable as a normal package
# regardless of how Streamlit execs its page scripts, instead of mutating sys.path at runtime.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["job_app"]

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
exclude = "(^|/)(\\.venv|\\.mypy_cache|\\.pytest_cache|__pycache__)(/|$)"
