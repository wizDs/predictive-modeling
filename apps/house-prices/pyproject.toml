[project]
name = "house-prices"
version = "0.1.0"
description = ""
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "shared",
    "interface",
    "pandas>=2.2.3",
    "mlflow>=2.20.2",
    "toolz>=1.0.0",
    "pydantic>=2.10.6",
    "streamlit>=1.42.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.uv.sources]
shared = { path = "../../src/shared", editable = true }
interface = { path = "../../src/interface", editable = true }

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
exclude = "(^|/)(\\.venv|\\.mypy_cache|\\.pytest_cache|__pycache__|data)(/|$)"
