[project]
name = "weather"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=18.0.0",
    "pandas>=2.2.3",
    "pydantic>=2.9.2",
    "polars>=1.13.1",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.153.0",
    "dmi-open-data>=0.1.2",
    "sqlmodel>=0.0.22",
    "pyodbc>=5.2.0",
    "python-dotenv>=1.0.1",
    "more-itertools>=10.5.0",
    "tqdm>=4.67.1",
    "pyspark>=3.5.4",
    "delta-spark>=3.2.1",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pandas-stubs>=2.2",
    "types-python-dateutil>=2.9",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
exclude = "(^|/)(\\.venv|\\.mypy_cache|\\.pytest_cache|__pycache__|data)(/|$)"
