name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # affected_dirs.sh needs history back to the PR's merge base with main.
          # NOTE: fetch-depth values must be quoted strings here -- the bare number 0 is falsy
          # in GitHub Actions expressions, so `cond && 0 || 1` always evaluates to 1 regardless
          # of cond, silently defeating this on every pull_request run.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel') }}
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --group dev
      - name: Run mypy on packages affected since main
        if: github.event_name == 'pull_request'
        run: |
          dirs=$(.github/scripts/affected_dirs.sh origin/main)
          if [ -z "$dirs" ]; then
            echo "No src/ packages affected; skipping mypy."
          else
            echo "Affected packages: $dirs"
            uv run mypy $dirs
          fi
      - name: Run mypy on all packages
        if: github.event_name != 'pull_request'
        run: uv run mypy src/
