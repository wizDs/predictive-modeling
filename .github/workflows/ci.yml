name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ruff does a syntax-level lint, not a type check, so it needs no project
      # dependencies installed -- unlike mypy/mypy-apps, one full-repo scan covers
      # src/* and every app without a per-app matrix (see issues/23).
      - uses: astral-sh/ruff-action@v3

  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      # dorny/paths-filter fetches the PR's changed-files list via the GitHub API for
      # pull_request events rather than using git history -- without this, it silently falls
      # back to treating every filter as changed (confirmed in CI: the token only had Contents/
      # Metadata/Packages read by default, and every filter matched despite a single-file diff).
      pull-requests: read
      contents: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      affected_apps: ${{ steps.affected.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for `pants --changed-since=origin/main` below (same reason as the mypy
          # job's checkout) -- a shallow clone has no origin/main to diff against and fails
          # with "fatal: bad revision" (caught via the DEBUG changed-since dry run in CI).
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Changes to the workflow file itself re-run everything, since a CI logic change
          # could affect any job regardless of which paths it happens to touch.
          filters: |
            src:
              - 'src/**'
              - 'pants.toml'
              - 'pyproject.toml'
              - '.python-version'
              - '3rdparty/python/**'
              - '.github/workflows/ci.yml'
            apps:
              - 'apps/**'
              - '.github/workflows/ci.yml'
          list-files: shell
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: pantsbuild/actions/init-pants@8c037ac70a2cf031e8278af07d1d04732177684d
        with:
          named-caches-hash: ${{ hashFiles('3rdparty/python/*.lock') }}
      # apps/BUILD (and the per-app BUILD files under apps/*) give Pants its own view of
      # apps/** as source roots (see pants.toml's marker_filenames), tagged "app". That lets
      # Pants' own dependency-inference graph answer "which apps does this src/* change
      # affect" natively via --changed-dependents=transitive, instead of a hand-rolled
      # [tool.uv.sources]-parsing reverse-dependency graph -- a src/**-only change never
      # touches an apps/** path on its own, so the old apps_files-based detection alone could
      # never see it (github.com/wizDs/predictive-modeling/issues/16). Pants targets aren't
      # used to actually run mypy on apps/* (mypy-apps below still uses each app's own
      # uv-managed environment) -- purely for this dependency-graph lookup.
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: ".github/scripts/uv.lock"
      - name: Test pants-addrs-to-apps script
        working-directory: .github/scripts
        run: |
          uv sync --group dev
          uv run pytest -q
      - name: Build affected-apps list
        id: affected
        run: |
          if printf '%s\n' ${{ steps.filter.outputs.apps_files }} | grep -qx '.github/workflows/ci.yml'; then
            # A CI logic change could affect any app regardless of which paths it touches --
            # run every app that currently exists, not just the ones in this diff.
            pants_list_cmd=(pants --tag=app list ::)
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            pants_list_cmd=(pants --changed-since=origin/main --changed-dependents=transitive --tag=app list)
          else
            # Push to main: every app gets its mypy-apps leg re-run here, not just the ones
            # touched by this push -- deliberately matching the mypy(src) job's own
            # push-vs-PR split below (full check on push, incremental only on PR), rather than
            # diffing against github.event.before. That event.before-based incremental
            # approach was considered and rejected for mypy(src) already (see its own comment
            # above) as a hard-to-read footgun; push-to-main is rare enough that paying for a
            # full apps matrix there is the simpler, safer trade.
            pants_list_cmd=(pants --tag=app list ::)
          fi

          apps=$("${pants_list_cmd[@]}" | python3 .github/scripts/pants_addrs_to_apps.py)
          json=$(printf '%s\n' "$apps" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  mypy:
    name: mypy (src)
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always fetch full history. Only the pull_request path (--changed-since=origin/main)
          # actually needs this, but the push-to-main path is rare enough that a shallow-clone
          # special case isn't worth it -- and a previous attempt at that (a conditional
          # expression picking 0 vs 1) was a real, hard-to-read GitHub Actions footgun.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # Load-bearing, not just a nicety: Pants finds its interpreter by searching the
          # already-installed Pythons on the runner rather than provisioning its own, and
          # ubuntu-latest only ships 3.12 by default -- without this, `pants check` fails with
          # "No interpreter compatible with the requested constraints was found" (verified in CI).
          python-version-file: .python-version
      - uses: pantsbuild/actions/init-pants@8c037ac70a2cf031e8278af07d1d04732177684d
        with:
          named-caches-hash: ${{ hashFiles('3rdparty/python/*.lock') }}
      - name: Run mypy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # --tag='-app' excludes apps/* targets from the final check set (apps/BUILD tags
            # them "app" -- see the `changes` job) without narrowing --changed-dependents'
            # graph traversal itself: an apps/* file that depends on a changed src/* package
            # still correctly keeps that src/* package (and its other src/* dependents) in
            # scope, it just doesn't make Pants try to mypy-check the app itself. Apps are
            # type-checked separately, in their own uv-managed environments, by mypy-apps.
            pants --changed-since=origin/main --changed-dependents=transitive --tag='-app' check
          else
            pants check src::
          fi

  mypy-apps:
    name: mypy (apps/${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.affected_apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.affected_apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "apps/${{ matrix.app }}/uv.lock"
      - name: Install app
        working-directory: apps/${{ matrix.app }}
        run: uv sync --group dev
      - name: Run mypy
        working-directory: apps/${{ matrix.app }}
        run: uv run mypy --explicit-package-bases .
