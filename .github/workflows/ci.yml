name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mypy:
    name: mypy (src)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changed-since needs history back to the PR's merge base with main;
          # the full check on push to main doesn't need git history at all.
          # NOTE: fetch-depth values must be quoted strings here -- the bare number 0 is falsy
          # in GitHub Actions expressions, so `cond && 0 || 1` always evaluates to 1 regardless
          # of cond, silently defeating this on every pull_request run.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-python@v5
        with:
          # Load-bearing, not just a nicety: Pants finds its interpreter by searching the
          # already-installed Pythons on the runner rather than provisioning its own, and
          # ubuntu-latest only ships 3.12 by default -- without this, `pants check` fails with
          # "No interpreter compatible with the requested constraints was found" (verified in CI).
          python-version-file: .python-version
      - uses: pantsbuild/actions/init-pants@8c037ac70a2cf031e8278af07d1d04732177684d
        with:
          named-caches-hash: ${{ hashFiles('3rdparty/python/*.lock') }}
      - name: Run mypy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pants --changed-since=origin/main --changed-dependents=transitive check
          else
            pants check src::
          fi

  mypy-apps:
    name: mypy (apps/${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - churn
          - finance
          - house-prices
          - tools-app
          - tools-app/budget-app
          - tools-app/power-app
          - tools-app/transcribe
          - weather-data-db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "apps/${{ matrix.app }}/uv.lock"
      - name: Install app
        working-directory: apps/${{ matrix.app }}
        run: uv sync --group dev
      - name: Run mypy
        working-directory: apps/${{ matrix.app }}
        run: uv run mypy --explicit-package-bases .
